<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Matches</p>

    {% for match in matches %}
        <tr>
            <td>{{ match.home }} - </td>
            <td>{{ match.away }}</td>
            <br>
        </tr>
    
    {% else %}
    
        <p>Brak meczy do wyświetlenia.</p>
    
    {% endfor %}
        
</body>
</html>
